# feather-repo/.github/workflows/publish.yml
# Workflow réutilisable "tout-en-un" : build standard (macOS) puis publication (publish-ipa.yml, Linux).
# Les inputs xcode_version / prebuild / runner couvrent la plupart des cas particuliers (Expo, CocoaPods…).

name: Build & publish to Feather

on:
  workflow_call:
    inputs:
      scheme:        { required: true,  type: string }
      bundle_id:     { required: true,  type: string }
      app_name:      { required: true,  type: string }
      build_args:    { required: false, type: string, default: "" }   # ex: -workspace ios/App.xcworkspace
      prebuild:      { required: false, type: string, default: "" }   # commandes shell avant xcodebuild
      xcode_version: { required: false, type: string, default: "" }   # ex: "27" ; vide = Xcode par défaut du runner
      runner:        { required: false, type: string, default: macos-latest }

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    concurrency:
      group: feather-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      version: ${{ steps.ipa.outputs.version }}
      build: ${{ steps.ipa.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        if: inputs.xcode_version != ''
        run: |
          XC=$(ls -d /Applications/Xcode_${{ inputs.xcode_version }}*.app | sort -V | tail -1)
          [ -n "$XC" ] || { echo "::error::Xcode ${{ inputs.xcode_version }} absent de ${{ inputs.runner }}"; ls /Applications; exit 1; }
          sudo xcode-select -s "$XC" && xcodebuild -version

      - name: Generate Xcode project (XcodeGen)
        run: |
          if [ -f project.yml ] && ! ls *.xcodeproj >/dev/null 2>&1; then
            brew install xcodegen && xcodegen generate
          fi

      - name: Prebuild
        if: inputs.prebuild != ''
        run: ${{ inputs.prebuild }}

      - name: Build unsigned IPA
        id: ipa
        run: |
          BUILD=${{ github.run_number }}
          xcodebuild ${{ inputs.build_args }} -scheme "${{ inputs.scheme }}" -configuration Release \
            -sdk iphoneos -derivedDataPath build CURRENT_PROJECT_VERSION=$BUILD \
            CODE_SIGNING_ALLOWED=NO build
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          VER=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP_PATH/Info.plist")
          mkdir Payload && cp -R "$APP_PATH" Payload/
          zip -qry app.ipa Payload
          { echo "version=$VER"; echo "build=$BUILD"; } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with: { name: ipa, path: app.ipa, retention-days: 1 }

  publish:
    needs: build
    uses: Bulgus/feather-repo/.github/workflows/publish-ipa.yml@main
    with:
      bundle_id: ${{ inputs.bundle_id }}
      app_name: ${{ inputs.app_name }}
      version: ${{ needs.build.outputs.version }}
      build: ${{ needs.build.outputs.build }}
    secrets: inherit
